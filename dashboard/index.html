<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADAR Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gruvbox: {
                            bg0: '#282828', bg1: '#3c3836', bg2: '#504945', bg3: '#665c54',
                            fg0: '#fbf1c7', fg1: '#ebdbb2', fg4: '#a89984',
                            red: '#cc241d', red_bright: '#fb4934',
                            green: '#98971a', green_bright: '#b8bb26',
                            blue: '#458588', blue_bright: '#83a598'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Dark Mode Map Hack */
        .leaflet-layer,
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out,
        .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        
        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background-color: #3c3836;
            color: #ebdbb2;
        }
        .leaflet-popup-content {
            margin: 12px;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #282828; }
        ::-webkit-scrollbar-thumb { background: #504945; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #665c54; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col bg-gruvbox-bg0 text-gruvbox-fg0 overflow-hidden font-sans">

    <header class="h-16 bg-gruvbox-bg1 flex items-center justify-between px-6 shadow-md z-20 border-b border-gruvbox-bg2">
        <div class="flex items-center gap-3">
            <svg class="w-6 h-6 text-gruvbox-blue_bright" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
            </svg>
            <h1 class="text-xl font-bold tracking-wider text-gruvbox-fg0">RADAR COMMAND CENTER</h1>
        </div>
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2 bg-gruvbox-bg0 px-3 py-1.5 rounded-full border border-gruvbox-bg2">
                <div id="status-indicator" class="w-3 h-3 rounded-full bg-gruvbox-red_bright"></div>
                <span id="status-text" class="text-sm font-medium text-gruvbox-fg1">Offline</span>
            </div>
            <button id="toggle-network-btn" onclick="toggleNetwork()" class="px-4 py-2 bg-gruvbox-blue hover:bg-gruvbox-blue_bright rounded text-sm font-semibold transition-colors shadow text-gruvbox-bg0">
                Connect Network
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <aside class="w-96 bg-gruvbox-bg1 border-r border-gruvbox-bg2 flex flex-col z-10">
            <div class="p-4 border-b border-gruvbox-bg2 flex justify-between items-center bg-gruvbox-bg1">
                <h2 class="font-semibold text-gruvbox-fg1 tracking-wide uppercase text-sm">Live Incident Feed</h2>
                <span id="event-counter" class="text-xs bg-gruvbox-bg2 px-2 py-1 rounded text-gruvbox-fg4">0 Events</span>
            </div>
            <div id="incident-feed" class="flex-1 overflow-y-auto p-4 space-y-3">
            </div>
        </aside>

        <section class="flex-1 relative bg-gruvbox-bg0">
            <div id="map" class="absolute inset-0 z-0 bg-gruvbox-bg0"></div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([15.5, -7.2], 18);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Standard OSM Tiles - The CSS invert hack handles the dark mode
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let ws = null;
        let eventCount = 0;

        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const toggleBtn = document.getElementById('toggle-network-btn');
        const incidentFeed = document.getElementById('incident-feed');
        const eventCounter = document.getElementById('event-counter');

        function updateConnectionState(isConnected) {
            if (isConnected) {
                statusIndicator.className = 'w-3 h-3 rounded-full bg-gruvbox-green_bright shadow-[0_0_8px_rgba(184,187,38,0.8)]';
                statusText.textContent = 'Connected';
                toggleBtn.textContent = 'Simulate Network Drop';
                toggleBtn.className = 'px-4 py-2 bg-gruvbox-red hover:bg-gruvbox-red_bright rounded text-sm font-semibold transition-colors shadow text-gruvbox-bg0';
            } else {
                statusIndicator.className = 'w-3 h-3 rounded-full bg-gruvbox-red_bright shadow-[0_0_8px_rgba(251,73,52,0.8)]';
                statusText.textContent = 'Offline';
                toggleBtn.textContent = 'Reconnect Network';
                toggleBtn.className = 'px-4 py-2 bg-gruvbox-blue hover:bg-gruvbox-blue_bright rounded text-sm font-semibold transition-colors shadow text-gruvbox-bg0';
            }
        }

        function initWebSocket() {
            ws = new WebSocket('ws://localhost:8000/ws');
            ws.onopen = () => updateConnectionState(true);
            ws.onclose = () => { updateConnectionState(false); ws = null; };
            ws.onerror = () => updateConnectionState(false);
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    processTelemetry(data);
                } catch (e) {}
            };
        }

        function toggleNetwork() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            } else {
                incidentFeed.innerHTML = '';
                eventCount = 0;
                eventCounter.textContent = '0 Events';
                map.eachLayer((layer) => { if (layer instanceof L.CircleMarker) layer.remove(); });
                initWebSocket();
            }
        }

        function processTelemetry(data) {
            const lat = data.location.latitude;
            const lon = data.location.longitude;
            const detectionClass = data.detection.class;
            const confidence = data.detection.confidence;
            const timeString = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            const isPerson = detectionClass.toLowerCase() === 'person';
            const markerColor = isPerson ? '#83a598' : '#fb4934';
            const markerFill = isPerson ? '#458588' : '#cc241d';
            const borderClass = isPerson ? 'border-gruvbox-blue_bright' : 'border-gruvbox-red_bright';
            const textClass = isPerson ? 'text-gruvbox-blue_bright' : 'text-gruvbox-red_bright';

            map.panTo([lat, lon], { animate: true, duration: 1 });

            const popupHtml = `
                <div class="font-sans">
                    <div class="font-bold text-sm mb-1 uppercase" style="color: ${markerColor}">${detectionClass}</div>
                    <div class="text-xs text-gruvbox-fg1">Conf: ${(confidence * 100).toFixed(1)}%</div>
                    <div class="text-xs text-gruvbox-fg4 mt-1 font-mono">${lat.toFixed(5)}, ${lon.toFixed(5)}</div>
                </div>
            `;

            L.circleMarker([lat, lon], { radius: 6, color: markerColor, weight: 2, fillColor: markerFill, fillOpacity: 0.8 }).addTo(map).bindPopup(popupHtml);

            const card = document.createElement('div');
            card.className = `p-3 bg-gruvbox-bg2/50 rounded shadow border-l-4 ${borderClass} hover:bg-gruvbox-bg2 transition-colors`;
            card.innerHTML = `
                <div class="flex justify-between items-start">
                    <span class="font-bold uppercase tracking-wide text-sm ${textClass}">${detectionClass}</span>
                    <span class="text-xs font-mono text-gruvbox-fg4">${timeString}</span>
                </div>
                <div class="flex justify-between items-center mt-2">
                    <span class="text-xs text-gruvbox-fg1">Confidence: ${(confidence * 100).toFixed(1)}%</span>
                    <span class="text-[10px] text-gruvbox-fg4 font-mono">${data.drone_id}</span>
                </div>
            `;
            incidentFeed.insertBefore(card, incidentFeed.firstChild);
            eventCount++;
            eventCounter.textContent = `${eventCount} Event${eventCount !== 1 ? 's' : ''}`;
        }

        initWebSocket();
    </script>
</body>
</html>
